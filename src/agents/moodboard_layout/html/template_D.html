<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2400px;
    height: 3200px;
    background: #ffffff;
    padding: 32px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .board {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .row { display: flex; gap: 16px; }
  .img-cell {
    overflow: hidden;
    flex-shrink: 0;
  }
  .img-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .swatch-cell {
    background: #f8f8f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .swatch-row { display: flex; gap: 14px; align-items: center; }
  .dot {
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="board">

  <!-- Row 1: full width hero -->
  <div class="row" style="flex: 1.3;">
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_1}}" />
    </div>
  </div>

  <!-- Row 2: two equal -->
  <div class="row" style="flex: 1.1;">
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_2}}" />
    </div>
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_3}}" />
    </div>
  </div>

  <!-- Row 3: three + swatch -->
  <div class="row" style="flex: 0.85;">
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_4}}" />
    </div>
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_5}}" />
    </div>
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_6}}" />
    </div>
    <div class="swatch-cell" style="flex:0.8; height:100%;">
      <div class="swatch-row">
        <span class="dot" style="width:56px;height:56px;background:{{color_1}};"></span>
        <span class="dot" style="width:56px;height:56px;background:{{color_2}};"></span>
      </div>
      <div class="swatch-row">
        <span class="dot" style="width:42px;height:42px;background:{{color_3}};"></span>
        <span class="dot" style="width:42px;height:42px;background:{{color_4}};"></span>
        <span class="dot" style="width:42px;height:42px;background:{{color_5}};"></span>
      </div>
    </div>
  </div>

  <!-- Row 4: wide + small -->
  <div class="row" style="flex: 0.9;">
    <div class="img-cell" style="flex:2; height:100%;">
      <img src="{{image_7}}" />
    </div>
    <div class="img-cell" style="flex:1; height:100%;">
      <img src="{{image_8}}" />
    </div>
  </div>

</div>
</body>
</html>
